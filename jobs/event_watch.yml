name: event_watch
description: 每 30 分钟扫多源新闻 → flash 归一化 → 维度命中则邮件 + 触发委员会重跑
# 美股 + ASX 盘中（UTC 转 SH 时区已由 timezone 字段处理）
# 周一到周五 0-7 UTC 每 30 分钟（≈ 北京时间 8:00-15:00），可按用户实际市场调
schedule: "*/30 0-7 * * 1-5"
timezone: Asia/Shanghai
entry: jobs.event_watch:run
enabled: true  # 2026-05-15 default-on：用户记不住开关流程。无 DEEPSEEK_API_KEY 时
               # normalizer 失败 → scheduler 记 job_runs failed，不影响其他 job
