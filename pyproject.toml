[project]
name = "invest"
version = "0.5.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "ddgs>=9.10.0",
    "trafilatura>=2.0.0",
    "yfinance>=0.2.66",
    "readability-lxml>=0.8.1",
    "python-dotenv>=1.0.1",
    "pandas-stubs~=2.3.3",
    "markdown>=3.10",
    "requests-cache>=1.2.1",
    "requests>=2.32.5",
    "beautifulsoup4>=4.14.3",
    "lxml>=6.0.2",
    "pandas>=2.3.3",
    "python-frontmatter>=1.1.0",
    "apscheduler>=3.11.2",
    "websockets>=15.0.1",
    "exchange-calendars>=4.13.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "croniter>=6.2.2",
    "openai>=1.45",  # SDKAgent 直接走 OpenAI 兼容客户端调 DeepSeek
    "optuna>=4.0",   # 阶段 4 RL：Bayesian Optimization 搜参
    "feedparser>=6.0.10",  # 事件层 RSS 源（Reuters/BBC/FT/财新 免费 feed）
    "sqlite-vec>=0.1.6",   # 事件层向量精排（SQLite 扩展，不需要独立向量库）
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "httpx>=0.27",
    "import-linter>=2.0",   # 防 entry 层直调 core 原语漂移（见 ADR / CLAUDE.md "分层契约"）
]

# ============================================================================
# Import Rules（防漂移）
# ============================================================================
# 强制分层：entry (jobs / connectors / scripts) 必须走 service layer
# (core.committee_runner) 调委员会，不许直接 import core.committee 的 run_committee
# 跳过 wealth_context_view / event_brief 等共享 input loader。
#
# 跑：  lint-imports
# CI 已配（.github/workflows/ci.yml smoke section）
# ============================================================================
[tool.importlinter]
root_packages = ["jobs", "connectors", "scripts", "core", "agents", "services", "db", "utils"]

[[tool.importlinter.contracts]]
name = "Entry 不直接调 run_committee（必经 service layer / shared loaders）"
type = "forbidden"
source_modules = ["jobs", "connectors", "scripts"]
forbidden_modules = ["core.committee"]
# 只查直接 import；committee_runner 作为 service layer 合法转手 import core.committee
allow_indirect_imports = "true"
# allow list: 这些是合法直调（用 shared loader, 或者 daily_report 已经显式 prep）
ignore_imports = [
    # backtest_committee 是研究用，跟 production 委员会不共享 service layer
    "scripts.backtest_committee -> core.committee",
    # full_validation 是开卷下限验证（研究用），需 patch core.committee._persist 防污染
    "scripts.full_validation -> core.committee",
]
# 已删的孤儿 dep：
