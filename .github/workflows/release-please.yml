name: release-please

# 读 conventional commits 自动开 Release PR（3 条独立线）：
#   - 根目录 Python 后端     → tag v0.x.y       + CHANGELOG.md
#   - skills/invest          → tag invest-skill-v0.x.y        + skills/invest/CHANGELOG.md
#   - skills/invest-setup    → tag invest-setup-skill-v0.x.y  + skills/invest-setup/CHANGELOG.md
#
# 全自动闭环（2026-07-05）：[main CI 绿灯门] → 开 Release PR → 本 workflow 直接合并 → 再跑一轮
# release-please 切 tag/GitHub Release → 后端（"."）发版时顺手 uv publish 到 PyPI。
# 不依赖 tag push 事件触发后续 workflow——GITHUB_TOKEN 造的事件不会触发别的
# workflow，所以全部动作收在同一个 run 里。
#
# 多组件同时有 Release PR 时，合并第一个会让其余的 manifest 冲突——第二轮
# release-please 会刷新它们，下一次 main push 自动合并。不追求一轮清空。

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 1 * * *"   # 每日兜底：清掉因 manifest 冲突滞留的 release PR
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write   # MCP Registry OIDC 认证
  actions: write    # GHCR 镜像构建走 workflow_dispatch 派发（gh workflow run 需要）

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - id: gate
        name: CI 绿灯门（main 头 ci.yml 不绿就不合并、不发版）
        # 门卡在 main 头的 ci.yml push run 上。release PR 自己的 CI 不可信：GITHUB_TOKEN
        # 开的 PR 不正常触发 workflow（#252 那条 pull_request run 是 0 job 的空壳 failure）。
        # bot commit（release 合并 / ClawHub 版本盖章）本身不跑 CI，沿 first-parent 跳到
        # 最近的人类 commit。放在 release-please 之前，Release PR 就基于刚验过的 main 生成；
        # 每轮重解析 main 头，等待期间来了新 push 就改等新的。验过的 sha 写进 outputs.sha：
        # 合并前复核 main 没进新的人类 commit，PyPI 从 release tag 的 sha 构建，ClawHub
        # 发布前同样复核——门检之后才进 main 的 commit 一律不跟着发。
        # 0.33.0 / 0.33.1 就是 main CI 红着被自动合并发上 PyPI 的（#233-2）。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          resolve_main() {  # main 头 → 最近的人类 commit（API 版，此步还没 checkout）
            local sha
            sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha) || return 1
            while [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha" --jq .commit.author.name)" = "github-actions[bot]" ]; do
              sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha" --jq '.parents[0].sha') || return 1
            done
            # 空/null 绝不能流进 --commit 过滤（会退化成不过滤）
            [[ $sha =~ ^[0-9a-f]{40}$ ]] || { echo "::error::解析 main 头失败：'$sha'" >&2; return 1; }
            echo "$sha"
          }
          declare -f resolve_main > "$RUNNER_TEMP/resolve_main.sh"   # 合并步复核用同一份
          for i in $(seq 1 40); do   # 30s × 40 = 20 分钟
            sha=$(resolve_main)
            r=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --event push --commit "$sha" \
              --json status,conclusion -q '.[0] // empty | "\(.status)/\(.conclusion)"')
            case "$r" in
              completed/success) echo "sha=$sha" >> "$GITHUB_OUTPUT"; echo "✅ main $sha CI 绿，放行"; exit 0 ;;
              # ci.yml 在 main 上 cancel-in-progress：被新 push 顶掉的就改等新头
              completed/cancelled) if [ "$(resolve_main)" != "$sha" ]; then continue; fi ;;&
              completed/*) echo "::error::main $sha 的 CI 结论 $r——不合并、不发版"; exit 1 ;;
            esac
            echo "等 main $sha 的 CI（${r:-run 未出现}）$i/40"
            sleep 30
          done
          echo "::error::main $sha 的 CI 20 分钟内没绿（仍在跑或没有 ci.yml push run）——不合并、不发版"
          exit 1

      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Auto-merge release PRs
        # 不用 prs_created 门（它只在新建时为 true，更新已有 PR 时是 false）——
        # 直接扫 open 的 release-please 分支 PR，幂等
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GATED: ${{ steps.gate.outputs.sha }}
        run: |
          . "$RUNNER_TEMP/resolve_main.sh"
          gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --json number,headRefName \
            -q '.[] | select(.headRefName | startswith("release-please--")) | .number' \
          | while read -r n; do
            # 门检后 main 进了新的人类 commit → 本轮不合并，push 触发的下一轮会门检新头
            head=$(resolve_main)
            if [ "$head" != "$GATED" ]; then
              echo "::notice::main 已从门检的 $GATED 前进到 $head，本轮不合并 release PR"
              break
            fi
            # 保持 --merge 不换 squash：release 合并 commit 的 body 是 "chore(main): release x"
            # （隐藏类型 + 正好是 tag 边界），从没进过 CHANGELOG；0.32.0 的重复条目来自人工
            # 合并 feature PR #239 的 merge body，换这里的合并方式治不了。
            if gh pr merge "$n" --merge --repo "$GITHUB_REPOSITORY"; then
              echo "merged #$n"
            else
              # "下轮自愈"对 manifest 行冲突不成立（2026-07-16 #218 实证：
              # release-please 见 PR 内容没变就不刷新分支，冲突永远挂着）。
              # CONFLICTING 直接关闭删分支——release PR 内容是确定性生成的，
              # 下轮 release-please 从当前 main 干净重建，无损失。
              state=$(gh pr view "$n" --repo "$GITHUB_REPOSITORY" --json mergeable -q .mergeable)
              if [ "$state" = "CONFLICTING" ]; then
                gh pr close "$n" --repo "$GITHUB_REPOSITORY" --delete-branch \
                  --comment "manifest 冲突（多组件同轮发版的已知竞态），自动关闭重建"
                echo "closed conflicted #$n（下轮重建）"
              else
                echo "skip #$n（非冲突性合并失败：$state，人工看一眼）"
              fi
            fi
          done

      - id: rp2
        name: Cut tags/releases for just-merged PRs
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # ---- 后端发版 → 自动 publish 到 PyPI ----
      - name: Checkout (for build)
        if: ${{ contains(fromJSON(steps.rp2.outputs.paths_released || '[]'), '.') || contains(fromJSON(steps.rp.outputs.paths_released || '[]'), '.') }}
        uses: actions/checkout@v4
        with:
          # 精确构建 release tag 指向的 commit，不吃 main 上之后才进来的东西
          ref: ${{ steps.rp2.outputs.sha || steps.rp.outputs.sha }}

      - name: Publish to PyPI
        if: ${{ contains(fromJSON(steps.rp2.outputs.paths_released || '[]'), '.') || contains(fromJSON(steps.rp.outputs.paths_released || '[]'), '.') }}
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv build
          uv publish
          echo "✅ published $(grep '^version' pyproject.toml)"

      - name: Publish to MCP Registry
        if: ${{ contains(fromJSON(steps.rp2.outputs.paths_released || '[]'), '.') || contains(fromJSON(steps.rp.outputs.paths_released || '[]'), '.') }}
        run: |
          VERSION=$(grep '^version' pyproject.toml | cut -d'"' -f2)
          # 等 PyPI 索引可见（registry 会校验包存在 + README 里的 mcp-name 标记）
          for i in $(seq 1 20); do
            curl -sf "https://pypi.org/pypi/openinvest/$VERSION/json" >/dev/null && break
            sleep 15
          done
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > s.tmp && mv s.tmp server.json
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
          echo "✅ MCP Registry: io.github.longsizhuo/openinvest@$VERSION"

      - name: Dispatch GHCR image build
        # publish-image.yml 的 `on: push: tags` 永远不会被本 workflow 切的 tag 触发
        # （GITHUB_TOKEN 造的事件不触发其他 workflow）——v0.30.0~0.30.3 四个 tag 零触发、
        # 镜像停在 6-16 就是这么来的。workflow_dispatch 是该规则的官方例外，直接派发。
        if: ${{ contains(fromJSON(steps.rp2.outputs.paths_released || '[]'), '.') || contains(fromJSON(steps.rp.outputs.paths_released || '[]'), '.') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep '^version' pyproject.toml | cut -d'"' -f2)
          gh workflow run publish-image.yml --repo "$GITHUB_REPOSITORY" --ref "v$VERSION"
          echo "✅ dispatched GHCR build for v$VERSION"

      # ---- invest-skill 发版 → 自动 publish ClawHub bundle-plugin ----
      - name: Checkout (for ClawHub)
        if: ${{ contains(fromJSON(steps.rp2.outputs.paths_released || '[]'), 'plugin/skills/invest') || contains(fromJSON(steps.rp.outputs.paths_released || '[]'), 'plugin/skills/invest') }}
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Publish to ClawHub (bundle-plugin + skill)
        # 版本单一可信源 = SKILL.md frontmatter（release-please 刚 bump 完）。
        # 先把版本盖章进两个 manifest JSON 并 commit（scripts/publish_clawhub.sh
        # 的守卫要求溯源 commit 真实包含所发内容），再走脚本发布。
        # 脚本发两个条目：bundle-plugin + standalone skill（后者发布前自动把
        # SKILL.md 的中文 description 换成脚本内固化的英文版——ClawHub 目录面向
        # 英文用户，repo 内保持中文）。远端已是当前版本时幂等跳过，重跑安全。
        if: ${{ contains(fromJSON(steps.rp2.outputs.paths_released || '[]'), 'plugin/skills/invest') || contains(fromJSON(steps.rp.outputs.paths_released || '[]'), 'plugin/skills/invest') }}
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GATED: ${{ steps.gate.outputs.sha }}
        run: |
          git pull origin main
          # 盖章 commit 要推回 main，只能从 main 发；改为复核 main 上没有门检之后的人类 commit
          h=HEAD
          while [ "$(git log -1 --format=%an "$h")" = "github-actions[bot]" ]; do h="$h^"; done
          if [ "$(git rev-parse "$h")" != "$GATED" ]; then
            echo "::error::main 门检后进了未验的 $(git rev-parse "$h")——不发 ClawHub，tag 已切，CI 绿后手动 scripts/publish_clawhub.sh"
            exit 1
          fi
          VERSION=$(grep -m1 '^version:' plugin/skills/invest/SKILL.md | sed 's/version:[[:space:]]*//; s/[[:space:]]*#.*//')
          for f in plugin/openclaw.plugin.json plugin/package.json; do
            jq --arg v "$VERSION" '.version = $v' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          done
          if [ -n "$(git status --porcelain -- plugin/openclaw.plugin.json plugin/package.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add plugin/openclaw.plugin.json plugin/package.json
            git commit -m "chore(plugin): sync ClawHub manifest version to $VERSION"
            git push origin main
          fi
          npm i -g clawhub
          clawhub login --token "$CLAWHUB_TOKEN" --label "gh-actions release"
          bash scripts/publish_clawhub.sh
          echo "✅ ClawHub: openinvest@$VERSION"
