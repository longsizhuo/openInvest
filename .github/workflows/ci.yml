name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# pnl-data 分支是 hourly auto-push 的 SVG，跳过 CI 节省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # 跳过 [skip ci] 标记的 commit（我们的 pnl-bot autocommit 会带这个）
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "latest"

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install deps
        run: uv sync --frozen

      - name: Run pytest
        run: uv run pytest tests/ -v --tb=short
        env:
          # 测试不需要真凭据，用占位避免 dotenv warning
          DEEPSEEK_API_KEY: test-fake-key
          INVEST_LLM_BASE_DELAY: "0.01"  # 加速测试

      - name: M-stat research tests (统计层闸,带 scipy/statsmodels 数值栈)
        # 评测闸子的可信度全吊在 experiments/signal-eval/mstat.py。它依赖 scipy/statsmodels
        # (研究依赖,不进 production pyproject,走 uv run --with,同 DSPy 约定)。这一 lane 确保
        # 那些 fixture 在自动 CI 真跑——不只靠本地手敲 --with 才抓回归(base pytest 会 importorskip 跳过)。
        run: uv run --with scipy --with statsmodels python -m pytest experiments/signal-eval/ -q

      - name: Import rules (防 entry 直调 core primitives 漂移)
        # 强制分层契约：jobs / connectors / scripts 不能直接 import core.committee
        # 跳过 shared input loaders（如 load_wealth_context_view）。配置见 pyproject.toml
        # [tool.importlinter]。允许 list 也在那里维护。
        run: uv run lint-imports --no-cache

      - name: 计算层纯度 AST 守卫（ADR-026：纯模块禁外部 IO 库 + 时钟）
        # import-linter 只能封内部模块（外部包不进 grimp 图）——yfinance/requests/
        # urllib/sqlite3 import 与 .now() 时钟调用由本步兜底。走 AST 而非 grep：
        # docstring/注释里提到这些词不误伤，且连 pd.Timestamp.now() 也抓。
        # 名单与 pyproject [tool.importlinter] 纯度契约保持一致。
        run: |
          uv run python - <<'PYEOF'
          import ast, glob, sys

          BANNED_IMPORTS = {"yfinance", "requests", "urllib", "sqlite3"}
          FILES = sorted(
              glob.glob("src/openinvest/calc/*.py") + [
                  "src/openinvest/jobs/daily_report_builder.py",
                  "src/openinvest/jobs/pnl_render.py",
                  "src/openinvest/jobs/review_calc.py",
                  "src/openinvest/jobs/dreaming_calc.py",
                  "src/openinvest/core/committee/cio_parse.py",
                  "src/openinvest/core/committee/debate_calc.py",
                  "src/openinvest/core/runner/intervention_rules.py",
                  "src/openinvest/core/runner/event_format.py",
                  "src/openinvest/core/decision_calc.py",
                  "src/openinvest/core/schemas.py",
              ]
          )
          bad = []
          for f in FILES:
              tree = ast.parse(open(f).read())
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      for a in node.names:
                          if a.name.split(".")[0] in BANNED_IMPORTS:
                              bad.append(f"{f}:{node.lineno} import {a.name}")
                  elif isinstance(node, ast.ImportFrom):
                      if (node.module or "").split(".")[0] in BANNED_IMPORTS:
                          bad.append(f"{f}:{node.lineno} from {node.module} import ...")
                  elif isinstance(node, ast.Call):
                      fn = node.func
                      if isinstance(fn, ast.Attribute) and fn.attr == "now":
                          bad.append(f"{f}:{node.lineno} .now() 时钟调用（时间是输入不是环境）")
          if bad:
              print("❌ 计算层纯度违规（ADR-026）：")
              print("\n".join(bad))
              sys.exit(1)
          print(f"✅ 计算层纯度 AST 守卫通过（{len(FILES)} 个纯模块）")
          PYEOF

      - name: Smoke import check
        # 确保关键模块没有 import 错误
        # v2 重构（2026-05）：_render_portfolio_body → _render_portfolio_body_v2 (cash dict + holdings list)
        # Sprint 1+2 (2026-05) 新增：trades_db / state_bus / insights_db / daily_report_builder
        run: |
          uv run python -c "from openinvest.core.committee import parse_cio_memo, AGENT_UNAVAILABLE_MARKER"
          uv run python -c "from openinvest.core.config import effective_api_config, set_persisted_override, clear_persisted_override, API_SETTABLE, DCAConfig"
          uv run python -c "from openinvest.core.memory_store import MemoryStore, _atomic_write_text"
          uv run python -c "from openinvest.core.portfolio_manager import PortfolioManager, _render_portfolio_body_v2"
          uv run python -c "from openinvest.jobs.pnl_snapshot import _is_trading_window, _redact_token_in, _outperform_events"
          uv run python -c "from openinvest.jobs.daily_report_builder import assemble_full_report, classify_asset_freshness, format_staleness_warning, portfolio_summary_text"
          uv run python -c "from openinvest.jobs.dca_daily import run, _holding_for_quote"
          uv run python -c "from openinvest.core.benchmarks import BENCHMARKS, get_all_series"
          uv run python -c "from openinvest.utils.fx import get_fx_rate, cash_total_in_base"
          uv run python -c "from openinvest.utils.advisory import is_advisory_mode"
          uv run python -c "from openinvest.utils.market_metrics import TRADING_DAYS_2Y, _calc_price_quantile"
          uv run python -c "from openinvest.connectors.web_api import app"
          uv run python -c "from openinvest.jobs.path_review import run, realized_path, score_one"
          uv run python -c "from openinvest.jobs.intervention_review import load_interventions, score, summarize"
          uv run python -c "from openinvest.core.decision_ledger import parse_committee_file, record_execution, list_decisions, summarize_decisions"
          uv run python -c "from openinvest.connectors.mcp_server import mcp, main"
          uv run python -c "from openinvest.services.holdings_import import parse_holdings, commit_parsed, _normalize_holding"
          uv run python -c "from openinvest.services.discord_notify import send_discord_alert"
          uv run python -c "from openinvest.services.news_sources.searxng_news import fetch_searxng_news, searxng_base_url"
          uv run python -c "from scripts.backfill_history import backfill, main, _num, COMMODITY_DEEP_HISTORY"
          uv run python -c "from openinvest.core.regime_probability import forward_return"
          uv run python -c "from openinvest.core.committee_runner import rule_family, _intervention_record, _gold_defense_dca_gate"
          uv run python -c "from openinvest.connectors.state_bus import write_committee_status, read_committee_status, _get_status_lock"
          uv run python -c "from openinvest.db.trades_db import TradesDB"
          uv run python -c "from openinvest.db.insights_db import InsightsDB"
          uv run python -c "import scripts.export_accuracy"
          uv run python -c "import scripts.snapshot"
          uv run python -c "from openinvest.db.event_store import EventStore, claim_to_event_id"
          uv run python -c "from openinvest.services.embeddings import embed_text, DEFAULT_DIM"
          uv run python -c "from openinvest.services.event_normalizer import normalize, NormalizedEvent"
          uv run python -c "from openinvest.services.event_ingest import ingest_events"
          uv run python -c "from openinvest.services.event_notifier import send_event_alert"
          uv run python -c "from openinvest.services.news_sources import fetch_all, RawNewsItem"
          uv run python -c "from openinvest.services.news_sources.rss_feed import load_default_feeds"
          uv run python -c "from openinvest.jobs.event_watch import run as event_watch_run"
          uv run python -c "from openinvest.jobs.price_sentinel import run as price_sentinel_run"
          uv run python -c "from openinvest.core.committee_runner import _resolve_event_brief, format_event_brief"
          uv run python -c "from openinvest.services.skill_views import build_status_view, build_strategy_view, build_history_view, build_what_if_view, build_doctor_view"
          uv run python -c "from openinvest.core.committee_runner import prepare_committee_brief, save_committee_transcript"
          uv run python -c "from openinvest.remote_dispatch import maybe_dispatch_remote"
          # calc 计算层 + 域绑定纯模块（ADR-026；旧路径 façade 行在上面继续存在，专职验兼容）
          uv run python -c "from openinvest.calc.regime import classify_regime, format_regime_brief, get_thresholds, THRESHOLDS"
          uv run python -c "from openinvest.calc.market_metrics import compute_metrics, TRADING_DAYS_2Y, _calc_price_quantile"
          uv run python -c "from openinvest.calc.strategy_metrics import evaluate_strategy, total_return_pct, max_drawdown_pct, sortino_ratio, vs_benchmark"
          uv run python -c "from openinvest.calc.backtest_reward import compute_strategy_reward"
          uv run python -c "from openinvest.calc.symbols import safe_symbol"
          uv run python -c "from openinvest.calc.series import BenchmarkSeries, to_pct_series, _generate_constant_apr"
          uv run python -c "from openinvest.calc.transaction_costs import TransactionCostCalculator, CostSnapshot, format_cost_report"
          uv run python -c "from openinvest.calc.timeframe_analysis import analyze_multi_timeframe, _apply_cutoff"
          uv run python -c "from openinvest.calc.regime_probability import compute_regime_return_frame, calibrate_profile, quote_currency_iso, _make_regime_probability, RegimeProbability, ReentryEstimate"
          uv run python -c "from openinvest.calc.sentiment import _vix_label, _parse_event_brief_entries, _stance_score"
          uv run python -c "from openinvest.calc.gold import format_gold_report, GoldPriceSnapshot"
          uv run python -c "from openinvest.jobs.pnl_render import render_svg, _pct_label_pos, _outperform_events, _is_trading_window"
          uv run python -c "from openinvest.jobs.review_calc import summarize_verdict_reviews, summarize_path_reviews, _flat_band, _is_hit, realized_shape, VerdictReview, PathReview"
          uv run python -c "from openinvest.jobs.dreaming_calc import _classify_regime, _score, _label, _slugify, _candidate_slug"
          uv run python -c "from openinvest.core.committee.debate_calc import _extract_signal_strength, _check_convergence, _format_debate_history"
          uv run python -c "from openinvest.core.runner.intervention_rules import rule_family, _extract_regime_label"
          uv run python -c "from openinvest.core.runner.event_format import format_event_brief"
          uv run python -c "from openinvest.core.decision_calc import summarize_decisions, _vid_matches, _match_trades"

      - name: uv build 打包烟测（issue #179 P2：打包断裂别等发版才发现）
        # PR 阶段零打包验证曾让 "uv sync 缺 PYPI_README.md 就炸" 的问题活到 Docker build
        run: uv build

      - name: run.sh 冒烟（Direct 路径唯一 shell 入口，issue #179 P1-B②）
        # 近一周连出两个 run.sh 回归（REPO_ROOT 相对路径 / 退出码被吞）而 CI 零覆盖。
        # dev-mode 走本仓 src/，不打 PyPI；临时 INVEST_HOME 隔离数据目录。
        run: |
          export INVEST_HOME="$(mktemp -d)"
          export OPENINVEST_DEV_MODE=1
          out="$(bash plugin/skills/invest/scripts/run.sh doctor)"
          echo "$out" | uv run python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("status")=="needs_setup", d'
          # 退出码不能被吞：未知子命令必须非零退出
          if bash plugin/skills/invest/scripts/run.sh definitely_not_a_cmd >/dev/null 2>&1; then
            echo "❌ 未知子命令应非零退出（退出码被吞回归）"; exit 1
          fi

      - name: 脱敏聚合输出无敏感字段（金融视角红线）
        # PM-Growth 妥协方案：accuracy_summary.json 公开数据绝不能含 symbol / threshold / verdict 等
        # 用仓库自带的 docs/accuracy_summary.json 作 fixture 验证
        run: |
          if [ -f docs/accuracy_summary.json ]; then
            # 字段名按带引号 JSON key 匹配；symbol 值（NDQ.AX / GC=F）按子串匹配
            # ——旧写法 "\"NDQ\"" 匹配不到值 "NDQ.AX"，防线形同虚设（issue #179 P2）
            for keyword in '"symbol"' '"threshold"' '"verdict_id"' '"asset"' NDQ 'GC=F'; do
              if grep -qF "$keyword" docs/accuracy_summary.json; then
                echo "❌ accuracy_summary.json 含敏感字段 '$keyword'"
                exit 1
              fi
            done
            echo "✅ 脱敏聚合输出无敏感字段"
          fi

      - name: OKF 文档 frontmatter lint（非阻塞：未迁移文档不算失败）
        # okf-frontmatter skill：已迁移文档的断链 / schema_source 指向消失符号 / 缺 type 才 fail。
        # 未加 frontmatter 的文档算 not_migrated（info），不阻塞 CI。
        run: uv run python skills/okf-frontmatter/scripts/find_docs.py --repo . lint --ci
