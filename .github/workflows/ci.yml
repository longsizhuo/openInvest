name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# pnl-data 分支是 hourly auto-push 的 SVG，跳过 CI 节省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # 跳过 [skip ci] 标记的 commit（我们的 pnl-bot autocommit 会带这个）
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install deps
        run: uv sync --frozen

      - name: Run pytest
        run: uv run pytest tests/ -v --tb=short
        env:
          # 测试不需要真凭据，用占位避免 dotenv warning
          DEEPSEEK_API_KEY: test-fake-key
          INVEST_LLM_BASE_DELAY: "0.01"  # 加速测试

      - name: Import rules (防 entry 直调 core primitives 漂移)
        # 强制分层契约：jobs / connectors / scripts 不能直接 import core.committee
        # 跳过 shared input loaders（如 load_wealth_context_view）。配置见 pyproject.toml
        # [tool.importlinter]。允许 list 也在那里维护。
        run: uv run lint-imports

      - name: Smoke import check
        # 确保关键模块没有 import 错误
        # v2 重构（2026-05）：_render_portfolio_body → _render_portfolio_body_v2 (cash dict + holdings list)
        # Sprint 1+2 (2026-05) 新增：trades_db / state_bus / insights_db / daily_report_builder
        run: |
          uv run python -c "from core.committee import parse_cio_memo, AGENT_UNAVAILABLE_MARKER"
          uv run python -c "from core.memory_store import MemoryStore, _atomic_write_text"
          uv run python -c "from core.portfolio_manager import PortfolioManager, _render_portfolio_body_v2"
          uv run python -c "from jobs.pnl_snapshot import _is_trading_window, _redact_token_in, _outperform_events"
          uv run python -c "from jobs.daily_report_builder import assemble_full_report, classify_asset_freshness, format_staleness_warning, portfolio_summary_text"
          uv run python -c "from core.benchmarks import BENCHMARKS, get_all_series"
          uv run python -c "from utils.fx import get_fx_rate, cash_total_in_base"
          uv run python -c "from connectors.web_api import app"
          uv run python -c "from connectors.state_bus import write_committee_status, read_committee_status, _get_status_lock"
          uv run python -c "from db.trades_db import TradesDB"
          uv run python -c "from db.insights_db import InsightsDB"
          uv run python -c "import scripts.export_accuracy"
          uv run python -c "from db.event_store import EventStore, claim_to_event_id"
          uv run python -c "from services.embeddings import embed_text, DEFAULT_DIM"
          uv run python -c "from services.event_normalizer import normalize, NormalizedEvent"
          uv run python -c "from services.event_notifier import send_event_alert"
          uv run python -c "from services.news_sources import fetch_all, RawNewsItem"
          uv run python -c "from services.news_sources.rss_feed import load_default_feeds"
          uv run python -c "from jobs.event_watch import run as event_watch_run"
          uv run python -c "from core.committee_runner import _resolve_event_brief, format_event_brief"

      - name: 脱敏聚合输出无敏感字段（金融视角红线）
        # PM-Growth 妥协方案：accuracy_summary.json 公开数据绝不能含 symbol / threshold / verdict 等
        # 用仓库自带的 docs/accuracy_summary.json 作 fixture 验证
        run: |
          if [ -f docs/accuracy_summary.json ]; then
            for keyword in symbol threshold NDQ GC=F verdict_id asset; do
              if grep -q "\"$keyword\"" docs/accuracy_summary.json; then
                echo "❌ accuracy_summary.json 含敏感字段 '$keyword'"
                exit 1
              fi
            done
            echo "✅ 脱敏聚合输出无敏感字段"
          fi
