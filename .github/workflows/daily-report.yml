name: daily-report

# 零成本自托管：fork(设为 private) → 填 secrets → 每天自动跑委员会发邮件。
# 状态(memory/)随每次运行 commit 回本 fork —— 所以 fork 必须 private(含真实持仓)。
# 详见 README「零成本自托管」。

on:
  schedule:
    - cron: "0 2 * * *"   # 02:00 UTC = 10:00 Asia/Shanghai。GH cron 只认 UTC。
  workflow_dispatch: {}     # 允许手动触发。注意:会重跑整个委员会(消耗 token)，不只是重发邮件。
                            # 现金/持仓账本不受影响、不重复入账(daily_report 只出建议不下单)。

# 同一时间只跑一个，避免两次 push 撞 memory/
concurrency:
  group: daily-report
  cancel-in-progress: false

permissions:
  contents: write           # 把更新后的 memory/ commit 回 fork

jobs:
  report:
    runs-on: ubuntu-latest
    # 只在 fork 上跑：上游 public 仓自己有常驻 cron，不该被这个 workflow 每天点红。
    if: github.repository != 'longsizhuo/openInvest'
    steps:
      # 隐私 fail-fast：fork 是 public 就拒跑——memory/(真实持仓) 会被 push 进公开 git。
      # 放在 checkout 前(gh 预装、无需代码)，漏设 private 时零 token 浪费直接红勾。
      - name: 确保 fork 为 private
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$(gh api "repos/$REPO" --jq .private)" != "true" ]; then
            echo "::error::此 fork 是 public —— memory/(真实持仓/现金/裁决) 会被 push 到公开 git。请到 Settings → Make private 后再启用。"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - run: uv sync

      # secrets → .env(daily_report / notifier 都 load_dotenv())。
      # 定界符加引号(<<'EOF') → secret 值里的 $ / 反引号不被 shell 二次展开(Actions 已先替换好值)。
      # LLM_BASE_URL/MODEL/PROVIDER 给非 DeepSeek 供应商(千问/智谱/任意 OpenAI 兼容端点)用，
      # 没设就是空 → utils/llm.py 走 `or` 回退默认，无害。
      - name: 写 .env
        run: |
          umask 077
          cat > .env <<'EOF'
          LLM_API_KEY=${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL=${{ secrets.LLM_BASE_URL }}
          LLM_MODEL=${{ secrets.LLM_MODEL }}
          LLM_PROVIDER=${{ secrets.LLM_PROVIDER }}
          DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}
          EMAIL_SENDER=${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD=${{ secrets.EMAIL_PASSWORD }}
          DIGEST_EMAIL_TO=${{ secrets.DIGEST_EMAIL_TO }}
          EOF

      - name: 跑每日委员会报告
        env:
          INVEST_HOME: ${{ github.workspace }}
        run: uv run python -m jobs.daily_report

      # memory/ 在 .gitignore 里 → 必须 -f 强加。无改动则跳过(fresh fork 未 init 时 daily_report skip)。
      - name: 持久化 memory/ 回 fork
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f memory/ || true
          if git diff --cached --quiet; then
            echo "memory/ 无变化，跳过 commit"
          else
            git commit -m "chore(state): daily_report $(date -u +%F) 持久化 memory/"
            git push
          fi
