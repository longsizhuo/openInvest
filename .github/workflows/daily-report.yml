name: daily-report

# 零成本自托管：fork(设为 private) → 填 secrets → 每天自动跑委员会发邮件。
# 状态(memory/)随每次运行 commit 回本 fork —— 所以 fork 必须 private(含真实持仓)。
# 详见 README「零成本自托管」。

on:
  schedule:
    - cron: "0 2 * * *"   # 02:00 UTC = 10:00 Asia/Shanghai。GH cron 只认 UTC。
  workflow_dispatch: {}     # 允许手动触发(daily_report 只读出报告，重跑最多重发一封邮件)

# 同一时间只跑一个，避免两次 push 撞 memory/
concurrency:
  group: daily-report
  cancel-in-progress: false

permissions:
  contents: write           # 把更新后的 memory/ commit 回 fork

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - run: uv sync

      # secrets → .env(daily_report / notifier 都 load_dotenv())
      - name: 写 .env
        run: |
          umask 077
          cat > .env <<EOF
          LLM_API_KEY=${{ secrets.LLM_API_KEY }}
          DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}
          EMAIL_SENDER=${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD=${{ secrets.EMAIL_PASSWORD }}
          DIGEST_EMAIL_TO=${{ secrets.DIGEST_EMAIL_TO }}
          EOF

      - name: 跑每日委员会报告
        env:
          INVEST_HOME: ${{ github.workspace }}
        run: uv run python -m jobs.daily_report

      # memory/ 在 .gitignore 里 → 必须 -f 强加。无改动则跳过(fresh fork 未 init 时 daily_report skip)。
      - name: 持久化 memory/ 回 fork
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f memory/ || true
          if git diff --cached --quiet; then
            echo "memory/ 无变化，跳过 commit"
          else
            git commit -m "chore(state): daily_report $(date -u +%F) 持久化 memory/"
            git push
          fi
