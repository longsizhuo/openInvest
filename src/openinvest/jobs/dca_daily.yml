name: dca_daily
description: 每日自动定投（external_funding，不扣子弹池现金）；标的/金额经 config.dca 配置
# 平日北京 15:30 / 18:30 / 21:30 三次（A 股 15:00 收盘）：记账价 = 当日首次缓存进库的 bar 价
# （get_history_data 当天已有 bar 就不重拉，通常是早盘盘中价，不保证是收盘价）；
# 行情晚到 / 拉取失败时 skip 并 unclaim，由后两次补记；已记过的后续运行 already_dca_today（ADR-016）
schedule: "30 15,18,21 * * mon-fri"
timezone: Asia/Shanghai
entry: openinvest.jobs.dca_daily:run
enabled: true   # 调度照常跑；真正开关是 config.dca.auto_dca_enabled（默认 False=no-op）
