# backup：每天自动备份账本与记忆（评审路线 Sprint 2 D2）。
# 先 checkpoint trades.db / insights.db / jobs.sqlite（把 WAL 里没落盘的成交刷进主库），
# 再把 memory/ + 这三个库打成 INVEST_ROOT/.backups/auto_<UTC时间戳>.zip，只留最近 14 份 auto_*。
# 不备 market_data.db / events.db（可重拉的缓存）与 .env。细节见 jobs/backup.py docstring。
# 03:30：避开 02:00 verdict_review 与 10:00 日报；此刻 event_watch / price_sentinel（0-2、8-23 点窗口）
# 与 dca_daily（工作日 15-21 点）都不跑，磁盘与账本最安静。
# 恢复：plugin/skills/invest-backup 的 `run.sh restore <zip>`（zip 内路径相对数据根目录）。
name: backup
description: 每日 03:30 自动备份 memory/ + 账本库（先 checkpoint WAL）→ .backups/auto_*.zip，留最近 14 份
schedule: "30 3 * * *"
timezone: Asia/Shanghai
entry: openinvest.jobs.backup:run
enabled: true
