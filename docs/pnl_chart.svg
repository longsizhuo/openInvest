<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 558" role="img" aria-label="PnL chart with benchmark bars">
  <style>
    .label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
    .title { font-family: -apple-system, "Segoe UI", sans-serif; font-size: 13px; font-weight: bold; }
  </style>
  <rect width="800" height="558" fill="#0d1117"/>

  <!-- ===== 上半：折线图（总权益单线）===== -->
