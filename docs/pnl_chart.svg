  <!-- 口径脚注：两侧统计口径不同，不可直接比大小（issue #179 P1-A③）-->
  <text x="50" y="548" fill="#6e7681" class="label">口径：★ 实盘 = 总权益时间加权收益（剔除存取款，含现金）；基准 = 窗口首日满仓一次性买入。口径不同，只看方向不比大小。</text>
</svg>
