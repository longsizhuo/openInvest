  <text x="50" y="278" fill="#c9d1d9" class="title">🏆 vs 9 基准 · 截至今日累计涨幅 (30 天，sample size 较小不构成 alpha 证据)</text>

  <line x1="665.4" y1="285" x2="665.4" y2="515" stroke="#30363d" stroke-width="1" stroke-dasharray="3 3"/><text x="665.4" y="282" text-anchor="middle" fill="#6e7681" class="label">0%</text>
  <text x="192" y="305.0" text-anchor="end" fill="#c9d1d9" class="label" font-weight="normal">Wealthfront (年化 6.2%)</text>
<rect x="665.4" y="293" width="7.2" height="16" fill="#58a6ff" opacity="0.7" rx="2"/>
