    <text x="20" y="4" fill="#c9d1d9" font-weight="bold">总权益（时间加权，剔除存取款）</text>
  </g>

  <!-- ===== 分隔线 ===== -->
  <line x1="50" y1="250" x2="770" y2="250"
        stroke="#21262d" stroke-width="1"/>

