services:
  # ── Web API（:8765）─────────────────────────────────────────────────────
  # GUI 已退役（2026-07-05），镜像不再烤 dist；web 服务只 serve /api。
  invest-web:
    build: .
    image: ghcr.io/longsizhuo/openinvest:latest   # build: . 在本地构建并打这个名；docker compose pull 可直接拉预构建镜像免本地 build
    container_name: invest-web
    restart: always
    env_file:
      - path: .env
        required: false            # 没 .env 也能起（server + GUI 能跑；committee 端点要 key 才工作）
    environment:
      - TZ=Asia/Shanghai
      # 容器内必须绑 0.0.0.0，宿主的端口映射才进得来 → openinvest-web 的启动守卫要求
      # INVEST_API_TOKEN（非 loopback 绑定 + 无 token = 拒绝启动）。token 写进 .env：
      #   INVEST_API_TOKEN=$(openssl rand -hex 32)
      # 设了之后 /api/*（除 /api/health 探活）都要带 `Authorization: Bearer <token>`。
      - INVEST_WEB_HOST=0.0.0.0
    ports:
      # host 侧默认只绑 loopback：本机直连或前面挂 Caddy 反代。
      # 要 LAN/公网暴露：改成 "8765:8765"（token 已是必填，无需再额外设）。
      - "127.0.0.1:8765:8765"
    volumes:
      - ./memory:/app/memory       # portfolio 状态 source of truth，必挂
      - ./db:/app/db
      - ./cache_data:/app/cache_data
      - ./logs:/app/logs
    # 走 openinvest-web 入口（带 token 守卫），不要直接起 uvicorn 绕过它——2026-10 评审 D6：
    # 旧写法裸调 uvicorn --host 0.0.0.0，全靠上面的 127.0.0.1 端口映射兜底，改一下 ports 就
    # 把无鉴权的全量读写 API 暴露出去。这里启动前先查 token，缺了给 compose 专属提示再退出。
    # （`$$` 是 compose 转义，让变量留给容器内 sh 展开；`docker compose run --rm invest-web
    #  openinvest init` 会整体替换 command，onboarding 不受这个检查影响。）
    command:
      - /bin/sh
      - -c
      - |
        if [ -z "$$INVEST_API_TOKEN" ]; then
          echo "❌ INVEST_API_TOKEN 未设置，invest-web 拒绝启动。" >&2
          echo "   容器内绑 0.0.0.0（端口映射需要），非 loopback 绑定必须有 bearer 鉴权。" >&2
          echo "   在 .env 加一行：INVEST_API_TOKEN=\$$(openssl rand -hex 32)，然后 docker compose up -d" >&2
          exit 1
        fi
        exec openinvest-web

  # ── 定时任务 scheduler（无端口，跑 daily_report / pnl_snapshot 等 cron）──────
  invest-agent:
    image: ghcr.io/longsizhuo/openinvest:latest   # 复用 invest-web 同名镜像（只 build/pull 一次）
    build: .
    container_name: invest-agent
    restart: always
    # 挂载配置文件 (用户只需修改本地的 .env)
    env_file:
      - path: .env
        required: false
    # 数据持久化 (memory/ 是 portfolio 状态的 source of truth，必挂；db / cache_data
    # 是 yfinance 行情缓存，丢了会从外网重新拉但费时间)
    volumes:
      - ./memory:/app/memory
      - ./db:/app/db
      - ./cache_data:/app/cache_data
      - ./logs:/app/logs
    # 时区设置 (确保定时任务准确)
    environment:
      - TZ=Asia/Shanghai
    # 启动前检查 onboarding 是否完成；缺 memory/ 就直接退出，
    # 友好提示用户先在 Claude Code 里用 skill 走 onboarding，或手动跑 init
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -f /app/memory/user.md ]; then
          echo "❌ memory/ 未初始化，scheduler 没法跑。" >&2
          echo "" >&2
          echo "三种方式完成 onboarding：" >&2
          echo "  1. 推荐：在 Claude Code 里说 \"帮我初始化 invest\"，让 skill 走 5 个问题" >&2
          echo "  2. 一次性容器跑 onboarding：" >&2
          echo "       docker compose run --rm invest-web python -m scripts.skill init" >&2
          echo "  3. 直接编辑 user_profile.json 后跑：" >&2
          echo "       docker compose run --rm invest-web python scripts/migrate_profile.py" >&2
          exit 1
        fi
        exec python -m openinvest.scheduler.runner
