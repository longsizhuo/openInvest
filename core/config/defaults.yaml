# defaults.yaml — tunable 参数默认值
# 注入优先级: default(dataclass) → this file → CLI → env
# locked 参数不进这个文件 — 它们在 locked.py 里，改需要 ADR。

regime:
  crash_atr_pct_min: 5.0
  crash_drawdown_30d_pct: 20.0
  crash_deep_drawdown_30d_pct: 30.0
  trend_ma_spread_pct: 3.0
  recovery_rebound_pct: 10.0
  recovery_quantile_max: 0.50
  low_quantile_threshold: 0.20
  high_quantile_threshold: 0.80
  per_asset:
    GC=F: { trend_ma_spread_pct: 5.0, crash_atr_pct_min: 3.5 }
    NDQ.AX: { trend_ma_spread_pct: 4.0 }
    BTC-USD: { trend_ma_spread_pct: 8.0, crash_atr_pct_min: 8.0 }
    ETH-USD: { trend_ma_spread_pct: 8.0, crash_atr_pct_min: 8.0 }

verdict:
  buy_confidence_overdrive: 0.95
  buy_confidence_downgrade_to: 0.6
  alloc_cny_ceiling: 100000
  worker_unavailable_confidence_floor: 0.4
  # 零花钱账户 + 强破产兜底时的 TRIM 约束阈值
  trim_no_trim_loss_pct: 5.0   # 浮亏 < 此值禁止 TRIM
  trim_caution_loss_pct: 10.0  # 浮亏 < 此值倾向 HOLD（Macro 非强 risk_off）

dreaming:
  min_recall: 3
  lookback_days: 90
  windows: [7, 30]

macro_buckets:
  vix_low: 18.0
  vix_high: 25.0
  tnx_low: 4.0
  tnx_high: 4.5

oracle_accuracy:
  buy_positive: 5.0
  buy_negative: -3.0
  accumulate_positive: 3.0
  accumulate_negative: -3.0
  hold_neutral: 3.0
  hold_wrong: 8.0
  trim_positive: -3.0
  trim_negative: 5.0
  sell_positive: -5.0
  sell_negative: 3.0

reward:
  weight_annualized_return: 1.0
  weight_max_drawdown: -0.5
  weight_alpha_vs_yuebao: 0.5
  weight_sharpe_bonus: 0.2
  sharpe_bonus_threshold: 1.0
  lam_mdd: 1.0
  lam_return: 0.05
