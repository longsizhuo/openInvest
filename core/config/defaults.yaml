# defaults.yaml — tunable 参数默认值
# 注入优先级: default(dataclass) → this file → CLI → env
# locked 参数不进这个文件 — 它们在 locked.py 里，改需要 ADR。

regime:
  crash_atr_pct_min: 5.0
  crash_drawdown_30d_pct: 20.0
  crash_deep_drawdown_30d_pct: 30.0
  trend_ma_spread_pct: 3.0
  recovery_rebound_pct: 10.0
  recovery_quantile_max: 0.50
  low_quantile_threshold: 0.20
  high_quantile_threshold: 0.80
  per_asset:
    GC=F: { trend_ma_spread_pct: 5.0, crash_atr_pct_min: 3.5 }
    NDQ.AX: { trend_ma_spread_pct: 4.0 }
    BTC-USD: { trend_ma_spread_pct: 8.0, crash_atr_pct_min: 8.0 }
    ETH-USD: { trend_ma_spread_pct: 8.0, crash_atr_pct_min: 8.0 }

verdict:
  buy_confidence_overdrive: 0.95
  buy_confidence_downgrade_to: 0.6
  alloc_cny_ceiling: 100000
  worker_unavailable_confidence_floor: 0.4
  # 集中度 lens：关掉=单资产/刻意集中用户不再被"超配减仓"纠缠（仍保留波动/回撤/止损/估值）。
  # 2026-06-25 默认翻 OFF（ADR-020）：持仓多是自选/watchlist 非净资产，集中度=风险前提对默认
  # 用户就错；想要的人显式开。env: INVEST_VERDICT_CONCENTRATION_LENS_ENABLED=true
  concentration_lens_enabled: false
  # steady=无方向锁(B链, Sharpe/回撤最优) | aggressive=uptrend顺势杠杆(HOLD→ACCUMULATE, +CR −Sharpe 深DD)
  risk_profile: steady
  # 黄金防御分批 DCA（2026-06-13 用户裁决采纳，wiki 18 §5）：高 VIX 不全拦黄金买入，
  # 改放行 1/3 一批、≥5 交易日一批、最多 3 批/20 交易日窗。参数机制选定非优化，
  # 靠反事实账本将来调；关掉(false)即退回旧"全拦"行为。
  gold_defense_dca_enabled: true
  gold_defense_dca_n_tranches: 3
  gold_defense_dca_fraction: 0.3333
  gold_defense_dca_min_spacing_days: 5
  gold_defense_dca_window_days: 20

dreaming:
  min_recall: 3
  lookback_days: 90
  windows: [7, 30]
  # Deep Sleep LLM 验伪（默认关=零 LLM 成本）。env 向后兼容 INVEST_DREAMING_LLM_VERIFY=1。
  llm_verify_enabled: false

macro_buckets:
  vix_low: 18.0
  vix_high: 25.0
  tnx_low: 4.0
  tnx_high: 4.5

sentiment:
  # VIX 近2年分位的恐慌/贪婪分档（高 VIX = 恐慌）
  vix_extreme_fear_q: 0.85
  vix_fear_q: 0.65
  vix_greed_q: 0.35
  vix_extreme_greed_q: 0.15
  # 快崩哨兵线: 分位 ≥ 此值 → INDEP_DEFENSE_FLAG=on（确定性买侧降级触发）
  vix_defense_quantile: 0.85
  # ATR 腿（通用口径, 尺度无关）: 当日 ATR% ≥ 此比值 × 自身近1年滚动中位 → 触发
  # sweep: OR 组合 capture NDQ 3/3、GC 13/16; ATR 腿独立 on_rate 3.6%/3.7%
  atr_defense_spike_ratio: 2.0
  # EVENT_STANCE 聚合: 默认 = 逐位等价旧纯计数（等权+无衰减+band 0）。
  # 2026-06-11 eval_event_stance.py 判 INSUFFICIENT_DATA —— 未经该脚本重跑
  # 给出达标结论前不许改这组默认值（ADR-010 rule 4）。
  event_stance_w_low: 1.0
  event_stance_w_mid: 1.0
  event_stance_w_high: 1.0
  event_stance_half_life_hours: 0.0   # 0 = 禁用时效衰减
  event_stance_neutral_band: 0.0

valuation:
  pe_expensive: 30.0   # trailing PE ≥ 此值判"偏贵"
  pe_cheap: 18.0       # trailing PE < 此值判"中性偏低"

path:
  # 路径分布校准层（calibrate_profile）。2026-06-11 经 fit(2007-2017, n=707×3窗)/
  # OOS(2018-2026, n=862×3窗) 验证 PASS（scripts/fit_path_calibration.py 预注册
  # 验收：OOS 三窗带覆盖 76/73/70% → 81/80/76% 全进 [75,85]，Brier 全窗改善）。
  # caveat：p_below 校准后与"事后基率"差距缩到 0.5-1.5% 但未反超（事后基率
  # 不可预知，仅参考）。重拟合：跑 walk-forward recompute 后重跑 fit 脚本。
  shrinkage_k: 80.0
  band_gamma: 1.1

oracle_accuracy:
  buy_positive: 5.0
  buy_negative: -3.0
  accumulate_positive: 3.0
  accumulate_negative: -3.0
  hold_neutral: 3.0
  hold_wrong: 8.0
  trim_positive: -3.0
  trim_negative: 5.0
  sell_positive: -5.0
  sell_negative: 3.0

reward:
  weight_annualized_return: 1.0
  weight_max_drawdown: -0.5
  weight_alpha_vs_yuebao: 0.5
  weight_sharpe_bonus: 0.2
  sharpe_bonus_threshold: 1.0
  lam_mdd: 1.0
  lam_return: 0.05
