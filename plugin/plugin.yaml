# Hermes Agent plugin manifest — the only copy; the repo-root plugin.yaml is a symlink to this file.
# Install: hermes plugins install longsizhuo/openInvest/plugin --enable
# Registers the skills under ./skills. The MCP tools are a separate Hermes surface (config.yaml), see description.
name: openinvest
version: "0.24.4" # x-release-please-version
description: Self-hosted AI investment committee — registers the invest, invest-setup and invest-backup skills. For the MCP tools, add the mcp_servers entry printed after install (runs this plugin's pinned run.sh).
author: longsizhuo
# The backend runs in its own uvx environment; keep Hermes from merging the repo's pyproject
# (needed when installed from the repo root, where pyproject.toml sits next to this file).
python_runtime: external
